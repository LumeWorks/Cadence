# cargo-deny config cho Cadence.
# Cadence là MPL-2.0. Dependency phải MPL-2.0-compatible (MIT/Apache-2.0 OK).
# Chạy: `cargo deny check` (cần cài `cargo-deny`).
# Đây là CI tool, không phải runtime dependency.

[graph]
# Kiểm toàn đồ thị dependency (kể cả transitive).
all-features = true

[advisories]
# Không bỏ qua advisory nào mặc định. Nếu buộc, ghi lý do + ngày + issue.
# db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Cadence MPL-2.0 tương thích với MIT và Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
]
confidence-threshold = 0.93
# Cadence chính là MPL-2.0.
exceptions = [
    { name = "cadence-ime", allow = ["MPL-2.0"] },
]

[bans]
# Không cấm multiple versions (criterion kéo nhiều transitive), chỉ warn.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Không cho phép duplicate với tên giống nhau.
deny = []
skip = []

[sources]
# Chỉ cho phép registry crates.io. Không git dependency, không path ngoài repo.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
