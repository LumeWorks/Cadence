[package]
name = "cadence-ime"
version = "2026.1.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "A safe and embeddable Vietnamese typing engine"
readme = "README.md"
keywords = ["vietnamese", "input", "ime", "telex", "vni"]
categories = ["text-processing", "internationalization"]
repository = "https://github.com/LumeWorks/Cadence"

[lib]
name = "cadence"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
trace = []
serde = ["dep:serde"]

[dependencies]
unicode-segmentation = { version = "1", default-features = false }
serde = { version = "1", default-features = false, optional = true, features = ["alloc", "derive"] }
unicode-normalization = { version = "0.1.25", default-features = false }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
unicode-normalization = "0.1.25"
unicode-segmentation = "1"
serde_json = "1"

[[bench]]
name = "xuyet"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
